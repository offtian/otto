# Alembic configuration for Otto.
#
#   just run-db-migrations          # upgrade to head
#   just build-migration "message"  # autogenerate a new revision
#   just downgrade-db-migration     # roll back one revision

[alembic]
script_location = %(here)s/migrations/alembic
prepend_sys_path = .
path_separator = os

# Overridden by the DATABASE_URL environment variable (see env.py).
sqlalchemy.url = postgresql+asyncpg://localhost:5432/otto

# Logging — consumed by env.py via fileConfig.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
