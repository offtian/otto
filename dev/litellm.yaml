# LiteLLM proxy config — dev stand-in for the firm's LLM gateway.
# Add an entry per model Otto should be able to reach.
model_list:
  - model_name: gpt-5.1
    litellm_params:
      model: openai/gpt-5.1
      api_key: os.environ/OPENAI_API_KEY

  # Local Ollama models. The litellm container reaches host Ollama via
  # host.docker.internal; use http://localhost:11434 if you run litellm on the
  # host instead. Pull them first: `ollama pull gemma4` / `ollama pull qwen3.6`.
  - model_name: gemma4
    litellm_params:
      model: ollama_chat/gemma4
      api_base: http://host.docker.internal:11434
  - model_name: qwen3.6
    litellm_params:
      model: ollama_chat/qwen3.6
      api_base: http://host.docker.internal:11434
